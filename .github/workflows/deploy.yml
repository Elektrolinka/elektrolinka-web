# Build (node build.js) a nasazení dist/ na GitHub Pages.
# Nastavení repozitáře: Settings → Pages → Source: „GitHub Actions“.
# Volitelně: Settings → Secrets and variables → Actions → Variables → MAKE_WEBHOOK_URL
# (přepíše makeWebhookUrl z config.json; URL je stejně veřejná ve zdrojáku stránky).
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # zmenšené obrázky (AVIF/WebP) se cachují, build pak trvá pár sekund
      - uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('assets/img/original/**', 'src/lib/images.js') }}
          restore-keys: img-

      - run: node build.js
        env:
          MAKE_WEBHOOK_URL: ${{ vars.MAKE_WEBHOOK_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
